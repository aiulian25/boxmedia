# BoxMedia — pull and run. Copy .env.example to .env, set BM_SESSION_SECRET, then:
#   docker compose up -d
# Nothing else.
#
# `init` runs for about a second and exits; `boxmedia` is the app. Both are pinned to
# one image reference and one pair of paths below, so a version bump or a moved
# directory is a single edit and the two can never end up out of step.
#
# To store the data somewhere other than beside this file, set BM_DATA_PATH and
# BM_SECRETS_PATH in .env.
#
# Binds 127.0.0.1 on purpose: front it with your reverse proxy (nginx / Traefik /
# Caddy / Pangolin / Cloudflare) for TLS and outside access. For direct LAN access
# without a proxy, change the bind to 0.0.0.0 and set BM_SECURE_COOKIES=false.

# The one place the version is written. Both services take it from here, so they cannot
# run different builds of the same app.
x-image: &image ghcr.io/aiulian25/boxmedia:1.2.1

x-data: &data ${BM_DATA_PATH:-./data}:/data

services:
  # Runs once, exits, and is the only thing here that is root. Docker creates a missing
  # bind-mount source as root:root, and the app runs as uid 65532 on a read-only
  # filesystem — so without this, the very first `up -d` on a new host dies with
  # "PermissionError: /data/config" before the app can say anything useful. It hands
  # /data to that uid and generates the encryption key if there is none. See
  # app/core/provision.py: it refuses to mint a fresh key over an existing install.
  init:
    image: *image
    container_name: boxmedia-init
    user: "0:0"
    entrypoint: ["/usr/bin/python3.11", "-m", "app.core.provision"]
    # The same .env, so it prepares whatever BM_DATA_DIR and BM_ENCRYPTION_KEY_FILE
    # actually name — a rotated key has a different filename.
    env_file: .env
    volumes:
      - *data
      # Writable here and read-only on the app: this is the one moment the key is
      # created, and nothing afterwards has any business changing it.
      - ${BM_SECRETS_PATH:-./secrets}:/secrets
    # It only ever touches those two paths: no network, and only the capabilities a
    # chown needs.
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  boxmedia:
    image: *image
    container_name: boxmedia
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # uvicorn trusts X-Forwarded-* from these proxy IPs, so login rate-limiting
      # sees the real client address instead of the proxy's.
      FORWARDED_ALLOW_IPS: ${BM_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${BM_HOST_PORT:-58546}:8686"
    volumes:
      # Everything the app stores: config, weekly history, logs, poster cache, backups.
      - *data
      # The key lives OUTSIDE the data directory, mounted read-only, so a backup of
      # that directory can never contain the key that decrypts it. The whole directory
      # rather than the file: Docker answers a missing file mount by creating a
      # DIRECTORY of that name, which is its own confusing failure.
      - ${BM_SECRETS_PATH:-./secrets}:/secrets:ro
    # The container runs read-only, unprivileged, capability-free; /data is the only
    # writable path. These lines are load-bearing — the app is built to run this way.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped
