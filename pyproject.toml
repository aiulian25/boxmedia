[build-system]
requires = ["setuptools>=77"]  # PEP 639 license/license-files
build-backend = "setuptools.build_meta"

[project]
name = "boxmedia"
version = "1.0.0"
description = "Automated weekly box-office-to-Radarr media library integration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "beautifulsoup4==4.12.3",
    "apscheduler==3.11.0",
    "argon2-cffi==23.1.0",
    "cryptography==50.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
    "trustme==1.2.1",
    "ruff==0.9.2",
    "pip-audit==2.7.3",
    # Asset authoring only (scripts/build-icons.py). Deliberately NOT a runtime
    # dependency — the image serves the committed icons, it never generates them.
    "pillow==11.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; keep it flagged in app code.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }
